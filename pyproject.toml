[build-system]
requires = ["setuptools==80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "bin3C"
description = "Extract metagenome-assembled genomes from metagenomic data using Hi-C linkage information"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Matthew Z DeMaere", email = "matt.demaere@gmail.com" },
]
keywords = ["bioinformatics", "3C", "genomics", "metagenomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "proxigenomics_toolkit @ git+https://github.com/cerebis/proxigenomics_toolkit@mldev",
    "pypalettes",
    "toml",
]

[project.urls]
Homepage = "https://github.com/cerebis/bin3C"
Repository = "https://github.com/cerebis/bin3C"

[project.scripts]
bin3C = "bin3C.command_line:main"

[tool.setuptools.packages]
find = {}

[dependency-groups]
docs = ["sphinx"]
test = ["pytest == 8.3.5"]
lint = ["mypy == 1.16.0", "ruff == 0.11.12"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"
